name: small-hero
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: smallhero
      POSTGRES_PASSWORD: smallhero_dev
      POSTGRES_DB: smallhero
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - small-hero-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smallhero -d smallhero"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  small-hero-postgres:
